<h2 mat-dialog-title>
  <mat-icon>{{ isEdit ? 'edit' : 'add' }}</mat-icon>
  {{ isEdit ? 'Edit Meal Plan' : 'New Meal Plan' }}
</h2>

<mat-dialog-content>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Name</mat-label>
    <input matInput [(ngModel)]="name" maxlength="120" placeholder="e.g. Week of June 2"
      (keydown.enter)="submit()" autofocus>
    <mat-hint align="end">{{ name.length }}/120</mat-hint>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Description (optional)</mat-label>
    <textarea matInput [(ngModel)]="description" maxlength="500" rows="3"
      placeholder="Add a short description..."></textarea>
    <mat-hint align="end">{{ description.length }}/500</mat-hint>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" [disabled]="!name.trim()" (click)="submit()">
    {{ isEdit ? 'Save' : 'Create' }}
  </button>
</mat-dialog-actions>
